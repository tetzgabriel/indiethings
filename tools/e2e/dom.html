<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title data-i18n="t.title">Original title</title>
<meta name="description" content="original description" data-i18n-attr="content:t.desc">
<style>html:lang(en) [data-lang="pt-BR"], html:lang(pt-BR) [data-lang="en"] { display: none; }</style>
<script src="/things18n/things18n.js" data-langs="en,pt-BR,ar" data-default="en"></script>
<script>
  things18n.add('en', { t: { title: 'EN title', desc: 'EN description' }, hello: 'Hello {name}', cards: { '=0': 'No cards', one: '{count} card', other: '{count} cards' }, html: 'Some <b>bold</b> text', ph: 'Type here', only: { en: 'only in english' } });
  things18n.add('pt-BR', { t: { title: 'Título PT', desc: 'Descrição PT' }, hello: 'Olá {name}', cards: { '=0': 'Nenhuma carta', one: '{count} carta', other: '{count} cartas' }, html: 'Texto <b>em negrito</b>', ph: 'Digite aqui' });
  things18n.add('ar', { hello: 'مرحبا {name}' }, { label: 'العربية' });
</script>
</head>
<body>
<!-- Run with: node tools/e2e/run.js /tools/e2e/dom.html -->
<h1 id="h" data-i18n="hello" data-i18n-params='{"name":"Ana"}'>Original hello</h1>
<p id="orig" data-i18n="not.in.any.dict">Original markup survives when no dictionary has the key</p>
<p id="fb" data-i18n="only.en">fallback text</p>
<p id="html" data-i18n-html="html">x</p>
<input id="inp" placeholder="orig ph" data-i18n-attr="placeholder:ph; title:hello" data-i18n-params='{"name":"Z"}'>
<p id="blockEn" data-lang="en">EN block</p>
<p id="blockPt" data-lang="pt-BR">PT block</p>
<nav id="sw" data-i18n-switch="short"></nav>
<nav id="sw2" data-i18n-switch></nav>
<select id="sel" data-i18n-select></select>
<button id="tog" data-i18n-toggle>toggle</button>
<div id="dyn"></div>
<pre id="out">running…</pre>
<script>
var out = [], failed = 0;
function ok(c, m) { out.push((c ? 'PASS ' : 'FAIL ') + m); if (!c) failed++; }
function $(id) { return document.getElementById(id); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function vis(id) { return getComputedStyle($(id)).display !== 'none'; }

(async function () {
  if (window.parent !== window) { $('out').textContent = ''; return; }  // this page is also loaded in an iframe below, as a ?lang= probe
  try {
    var i = things18n;
    // The detection result depends on the test browser; force a known start.
    i.setLang('en'); await sleep(50);

    ok(document.documentElement.lang === 'en' && document.documentElement.dir === 'ltr', 'html lang/dir set (en, ltr)');
    ok($('h').textContent === 'Hello Ana', 'data-i18n + params');
    ok(document.title === 'EN title', '<title data-i18n> translated');
    ok(document.querySelector('meta[name=description]').content === 'EN description', 'meta content via data-i18n-attr');
    ok($('orig').textContent.indexOf('Original markup') === 0, 'key missing everywhere: original markup is kept');
    ok($('html').innerHTML === 'Some <b>bold</b> text', 'data-i18n-html renders markup');
    ok($('inp').placeholder === 'Type here' && $('inp').title === 'Hello Z', 'multiple attributes in one data-i18n-attr');
    ok(vis('blockEn') && !vis('blockPt'), 'data-lang blocks: only English shown');
    ok($('sw').children.length === 3 && $('sw').children[0].textContent === 'EN' && $('sw').children[2].title === 'العربية', 'short switcher built with a button per language');
    ok(/^Portugu/.test($('sw2').children[1].textContent), 'long switcher uses native language names: ' + $('sw2').children[1].textContent);
    ok($('sw').querySelector('[aria-pressed=true]').textContent === 'EN', 'active button has aria-pressed=true');
    ok($('sel').options.length === 3 && $('sel').value === 'en', 'select is filled and set');

    // switch via button click
    $('sw').children[1].click(); await sleep(50);
    ok(document.documentElement.lang === 'pt-BR', 'click on switcher sets html lang');
    ok($('h').textContent === 'Olá Ana' && document.title === 'Título PT', 'DOM re-translated');
    ok($('fb').textContent === 'only in english', 'key missing in pt-BR falls back to the default language dictionary');
    ok(!vis('blockEn') && vis('blockPt'), 'data-lang blocks flipped');
    ok($('html').innerHTML === 'Texto <b>em negrito</b>', 'html re-translated');
    ok($('inp').placeholder === 'Digite aqui', 'attribute re-translated');
    ok($('sel').value === 'pt-BR' && $('sw').querySelector('[aria-pressed=true]').textContent === 'PT', 'switcher and select follow');
    ok(localStorage.getItem('things18n:lang') === 'pt-BR', 'choice persisted in localStorage');

    // select change
    $('sel').value = 'en'; $('sel').dispatchEvent(new Event('change', { bubbles: true })); await sleep(50);
    ok(i.lang === 'en', 'select change switches language');

    // toggle cycles through languages
    $('tog').click(); await sleep(30);
    ok(i.lang === 'pt-BR', 'toggle moves to next language');

    // fallback to default language for keys another language lacks
    i.setLang('ar'); await sleep(50);
    ok(document.documentElement.dir === 'rtl' && document.documentElement.lang === 'ar', 'rtl language sets dir=rtl');
    ok($('h').textContent === 'مرحبا Ana', 'Arabic hello');
    ok($('html').innerHTML === 'Some <b>bold</b> text', 'key missing in ar falls back to default language (en)');
    ok(i.t('cards', { count: 3 }) === '3 cards', 't() falls back to the default language dict');
    i.setLang('en');

    // events
    var seen = [], off = i.onChange(function (l, p) { seen.push(p + '>' + l); });
    var domEvt = 0; document.addEventListener('things18n:change', function () { domEvt++; });
    i.setLang('pt-BR'); await sleep(30); i.setLang('en'); await sleep(30); off();
    ok(seen.join() === 'en>pt-BR,pt-BR>en' && domEvt === 2, 'onChange callbacks and the DOM event both fire');

    // apply() for markup added later
    $('dyn').innerHTML = '<span id="late" data-i18n="hello" data-i18n-params=\'{"name":"Late"}\'>x</span>';
    i.apply($('dyn'));
    ok($('late').textContent === 'Hello Late', 'apply(root) translates content added later');
    i.setLang('pt-BR'); await sleep(30);
    ok($('late').textContent === 'Olá Late', 'late content re-translates on language change');
    i.setLang('en');

    // plurals
    ok(i.t('cards', { count: 0 }) === 'No cards' && i.t('cards', { count: 1 }) === '1 card' && i.t('cards', { count: 7 }) === '7 cards', 'plurals (en)');
    ok(i.t('cards', { count: 0 }, 'pt-BR') === 'Nenhuma carta' && i.t('cards', { count: 1 }, 'pt-BR') === '1 carta', 'plurals (pt-BR, =0 exact override)');

    // ?lang= handling, in a fresh iframe: the URL wins over storage; switching keeps the URL in step
    localStorage.setItem('things18n:lang', 'en');
    var fr = document.createElement('iframe'); fr.src = location.pathname + '?lang=pt-BR'; document.body.appendChild(fr);
    await new Promise(function (r) { fr.onload = r; }); await sleep(100);
    var w = fr.contentWindow;
    ok(w.things18n.lang === 'pt-BR' && w.document.documentElement.lang === 'pt-BR', '?lang=pt-BR beats the stored choice');
    ok(w.localStorage.getItem('things18n:lang') === 'en', '?lang= alone does not overwrite the stored choice');
    w.things18n.setLang('en'); await sleep(50);
    ok(/lang=en/.test(w.location.search), 'after a manual switch the URL param follows (reload keeps the choice): ' + w.location.search);
    fr.remove();

    // in-browser dictionary check (replaces needing Node): gaps between languages and {param} mismatches
    i.add('en', { pm: 'Hi {a}', onlyEn: 'x' }); i.add('pt-BR', { pm: 'Oi {b}' });
    var rp = i.report();
    ok(rp.dictionary.missing['pt-BR'].indexOf('onlyEn') >= 0, 'a key only the default language has IS reported as a pt-BR gap');
    ok(!rp.dictionary.missing.en, 'the default language is never reported as having gaps (its text lives in the HTML)');
    ok(rp.dictionary.missing.ar && rp.dictionary.missing.ar.indexOf('cards') >= 0, 'report().dictionary: Arabic lacks keys the others have');
    ok(rp.dictionary.params.some(function (x) { return x.indexOf('pm') === 0; }), 'report().dictionary: {param} mismatch between languages found');

    // no JS-visible raw keys
    ok(!/\b(t\.title|t\.desc|not\.in\.any\.dict)\b/.test(document.body.innerText.replace('Original markup survives when no dictionary has the key', '')), 'no raw keys rendered');
  } catch (e) { out.push('FAIL exception: ' + e.stack); failed++; }
  $('out').textContent = out.join('\n') + '\n' + (failed ? failed + ' FAILED' : 'ALL PASSED');
})();
</script>
</body>
</html>
