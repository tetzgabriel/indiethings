<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>things18n loaded from GitHub (remote import)</title>
<!-- Needs internet. Run: node tools/e2e/run.js /tools/e2e/remote.html
     Proves the "no download, no Node" install: the library is pulled from our GitHub Pages site and from jsDelivr. -->
<script src="https://meoriente.com.br/indiethings/things18n/things18n.js" data-switcher></script>
<script>things18n.add('en', { 'Olá, mundo': 'Hello, world' });</script>
</head>
<body>
<h1 id="h" data-t>Olá, mundo</h1>
<pre id="out">running…</pre>
<script>
var out = [], failed = 0;
function ok(c, m) { out.push((c ? 'PASS ' : 'FAIL ') + m); if (!c) failed++; }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
(async function () {
  try {
    ok(typeof things18n === 'object' && /^\d+\.\d+\.\d+$/.test(things18n.version), 'library loaded from meoriente.com.br (version ' + (window.things18n && things18n.version) + ')');
    ok(!!document.querySelector('.things18n-switcher'), 'data-switcher worked from the remote copy');
    things18n.setLang('en'); await sleep(50);
    ok(document.getElementById('h').textContent === 'Hello, world', 'key-less translation works');
    ok(typeof things18n.report === 'function' && typeof things18n.report().dictionary === 'object', 'in-browser debug report available (no Node)');
    // jsDelivr mirror of the repo
    var src = await (await fetch('https://cdn.jsdelivr.net/gh/tetzgabriel/indiethings@main/things18n/things18n.js')).text();
    ok(/things18n 1\.\d+\.\d+/.test(src), 'jsDelivr serves the file from GitHub with CORS');
    var css = await (await fetch('https://meoriente.com.br/indiethings/things18n/things18n.css')).text();
    ok(/html:lang\(pt\)/.test(css), 'things18n.css reachable cross-origin');
  } catch (e) { out.push('FAIL exception: ' + e.message); failed++; }
  document.getElementById('out').textContent = out.join('\n') + '\n' + (failed ? failed + ' FAILED' : 'ALL PASSED');
})();
</script>
</body>
</html>
