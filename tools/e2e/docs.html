<!doctype html>
<meta charset="utf-8">
<title>things18n docs e2e</title>
<pre id="out">running…</pre>
<script src="/tools/e2e/helpers.js"></script>
<script>
// Run: node tools/e2e/run.js /tools/e2e/docs.html   — drives the real docs page and the hub in an iframe.
function load(url) { return new Promise(function (res) { var f = document.createElement('iframe'); f.style.cssText = 'width:900px;height:900px'; f.onload = function () { setTimeout(function () { res(f); }, 300); }; f.src = url; document.body.appendChild(f); }); }
function shown(d) { return [].filter.call(d.querySelectorAll('[data-lang]'), function (e) { return d.defaultView.getComputedStyle(e).display !== 'none'; }).map(function (e) { return e.getAttribute('data-lang'); }); }
(async function () {
  try {
    localStorage.clear();
    // ---- docs
    var f = await load('/things18n/index.html?lang=en'), w = f.contentWindow, d = w.document;
    ok(d.documentElement.lang === 'en', 'docs: html lang en');
    ok(shown(d).length > 20 && shown(d).every(function (l) { return l === 'en'; }), 'docs: only English blocks visible (' + shown(d).length + ')');
    ok(d.title.indexOf('translations for plain HTML') > 0, 'docs: title in English');
    var cards = d.getElementById('demo-cards');
    ok(cards.textContent === 'You have no cards.', 'demo: zero -> ' + cards.textContent);
    d.getElementById('demo-add').click();
    ok(cards.textContent === 'You have 1 card.', 'demo: one -> ' + cards.textContent);
    d.getElementById('demo-add').click();
    ok(cards.textContent === 'You have 2 cards.', 'demo: other -> ' + cards.textContent);
    d.querySelector('.langswitch [data-i18n-set="pt-BR"]').click(); await sleep(100);
    ok(d.documentElement.lang === 'pt-BR' && cards.textContent === 'Você tem 2 cartas.', 'demo: re-rendered in Portuguese -> ' + cards.textContent);
    ok(shown(d).every(function (l) { return l === 'pt-BR'; }), 'docs: only Portuguese blocks visible');
    d.getElementById('demo-reset').click();
    ok(cards.textContent === 'Você não tem cartas.', 'demo: pt "=0" -> ' + cards.textContent);
    d.getElementById('demo-add').click();
    ok(cards.textContent === 'Você tem 1 carta.', 'demo: pt one -> ' + cards.textContent);
    ok(d.getElementById('demo-number').textContent.indexOf('1.234.567,891') > 0, 'demo: pt number format -> ' + d.getElementById('demo-number').textContent);
    ok(/Esta frase não tem chave/.test(d.body.textContent), 'demo: key-less data-t line translated');
    ok(d.getElementById('demo-input').placeholder === 'escreva alguma coisa…', 'demo: placeholder translated');
    var clone = d.body.cloneNode(true); [].forEach.call(clone.querySelectorAll('pre, code, dt, script, [data-lang]:not([data-lang="pt-BR"]), [style*="none"]'), function (e) { e.remove(); });
    ok(!/\b(demo\.(hello|placeholder|add|reset|cards|current|list|date|number)|meta\.(title|description)|nav\.back|lang\.label)\b/.test(clone.textContent), 'docs: none of the page keys show up as raw text (code samples excluded)');
    f.remove();

    // ---- JavaScript off: a sandboxed iframe without allow-scripts runs no scripts at all
    for (var pg of ['/index.html', '/things18n/index.html']) {
      var ns = await new Promise(function (res) { var fr = document.createElement('iframe'); fr.setAttribute('sandbox', 'allow-same-origin'); fr.style.cssText = 'width:900px;height:900px'; fr.onload = function () { setTimeout(function () { res(fr); }, 200); }; fr.src = pg + '?lang=pt-BR'; document.body.appendChild(fr); });
      var nd = ns.contentDocument, st = [].filter.call(nd.querySelectorAll('[data-lang]'), function (e) { return ns.contentWindow.getComputedStyle(e).display !== 'none'; }).map(function (e) { return e.getAttribute('data-lang'); });
      ok(st.length > 4 && st.every(function (l) { return l === 'en'; }), 'no JS ' + pg + ': exactly one language shown (the <html lang> one), ' + st.length + ' blocks');
      ns.remove();
    }

    // ---- hub
    localStorage.clear();
    var h = await load('/index.html?lang=pt-BR'), hd = h.contentWindow.document;
    ok(hd.documentElement.lang === 'pt-BR' && shown(hd).every(function (l) { return l === 'pt-BR'; }), 'hub: Portuguese blocks only');
    ok(/coisas por enquanto/.test(hd.getElementById('thing-count').textContent), 'hub: count line translated (' + hd.getElementById('thing-count').textContent + ')');
    ok(hd.querySelectorAll('#things li').length === 2 && /Paciência/.test(hd.getElementById('things').textContent), 'hub: registry rendered in Portuguese');
    ok(/jogo/.test(hd.querySelector('#things .kind').textContent), 'hub: kind label translated');
    hd.querySelector('.langswitch [data-i18n-set="en"]').click(); await sleep(100);
    ok(/Word solitaire/.test(hd.getElementById('things').textContent) && /things so far/.test(hd.getElementById('thing-count').textContent), 'hub: list re-rendered in English after switch');
    ok(shown(hd).every(function (l) { return l === 'en'; }), 'hub: English blocks only after switch');
    ok(/October|2026/.test(hd.querySelector('[data-today]').textContent) && !/outubro/.test(hd.querySelector('[data-today]').textContent), 'hub: date formatted in English: ' + hd.querySelector('[data-today]').textContent);
    ok(!/\b(cover\.scroll|arrow\.(why|rules|things|yours|last)|things\.(count|empty)|kind\.(game|tool|toy)|meta\.(title|description)|lang\.label)\b/.test(hd.body.innerText), 'hub: none of the page keys show up as raw text');
    // choice is shared with the game (same origin, same storage key)
    var g = await load('/me_associe/index.html');
    ok(g.contentWindow.things18n.lang === 'en', 'game: picks up the language chosen on the hub');
    g.remove(); h.remove();
  } catch (e) { out.push('FAIL exception: ' + e.stack); failed++; }
  finish();
})();
</script>
