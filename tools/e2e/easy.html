<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>things18n easy mode e2e</title>
<!-- zero config on purpose: no data-langs, no data-default. The default is <html lang>; languages come from add(). -->
<script src="/things18n/things18n.js" data-switcher></script>
<script>
  things18n.add('en', {
    'Olá, mundo': 'Hello, world',
    'Salvar alterações': 'Save changes',
    'Olá, {name}!': 'Hello, {name}!',
    'Buscar aqui': 'Search here',
    'Tchau': 'Bye'
  });
</script>
</head>
<body>
<h1 id="a" data-t>Olá, mundo</h1>
<button id="b" data-t>
   Salvar    alterações
</button>
<p id="c" data-t data-i18n-params='{"name":"Ana"}'>Olá, {name}!</p>
<input id="d" placeholder="Buscar aqui" aria-label="Buscar aqui" data-t-attr="placeholder aria-label">
<p id="e" data-t>Sem tradução nenhuma</p>
<p id="f" data-t>Misto <b>com tag</b></p>
<p id="g" data-lang="pt-BR">bloco pt</p><p id="h" data-lang="en">block en</p>
<pre id="out">running…</pre>
<script src="/tools/e2e/helpers.js"></script>
<script>
(async function () {
  if (window.parent !== window) { $('out').textContent = ''; return; }   // loaded as an iframe probe below
  try {
    var i = things18n;
    localStorage.clear();
    i.setLang('pt-BR'); await sleep(50);

    ok(i.default === 'pt-BR', 'default language inferred from <html lang>: ' + i.default);
    ok(i.langs.join() === 'pt-BR,en', 'languages come from add(): ' + i.langs.join());
    ok($('a').textContent === 'Olá, mundo' && $('b').textContent.indexOf('Salvar') >= 0, 'default language: source text untouched');
    ok($('c').textContent === 'Olá, Ana!', 'default language: {params} still filled in');

    // auto switcher
    var sw = document.querySelector('.things18n-switcher');
    ok(sw && sw.children.length === 2 && !sw.hidden, 'data-switcher injected a switcher with a button per language');
    ok(sw && getComputedStyle(sw).position === 'fixed' && parseInt(getComputedStyle(sw).top) === 12, 'switcher is fixed top-right by default');
    ok(sw.querySelector('[aria-pressed=true]').textContent === 'PT', 'active button marked');

    // key-less translation
    sw.querySelector('[data-i18n-set="en"]').click(); await sleep(50);
    ok($('a').textContent === 'Hello, world', 'data-t: text translated (source text is the key)');
    ok($('b').textContent === 'Save changes', 'data-t: whitespace-insensitive match');
    ok($('c').textContent === 'Hello, Ana!', 'data-t + params');
    ok($('d').placeholder === 'Search here' && $('d').getAttribute('aria-label') === 'Search here', 'data-t-attr: several attributes');
    ok($('e').textContent === 'Sem tradução nenhuma', 'data-t: untranslated text stays as written');
    ok($('f').innerHTML === 'Misto <b>com tag</b>', 'data-t on an element with children is left alone');
    ok(i.t('Tchau') === 'Bye' && i.t('Nada') === 'Nada', 't() accepts source text as the key too');
    ok(document.documentElement.lang === 'en', 'html lang follows');

    // back to the default restores the originals
    i.setLang('pt-BR'); await sleep(50);
    ok($('a').textContent === 'Olá, mundo' && $('d').placeholder === 'Buscar aqui', 'switching back restores the source text');

    // debug mode
    i.setLang('en'); await sleep(50);
    ok(!document.querySelector('[data-i18n-missing]') && !document.querySelector('.things18n-debug'), 'debug is off by default');
    i.debug(true); await sleep(50);
    var miss = [].map.call(document.querySelectorAll('[data-i18n-missing]'), function (e) { return e.id; });
    ok(miss.join() === 'e', 'debug marks only the untranslated element: [' + miss + ']');
    ok(getComputedStyle($('e')).outlineStyle === 'dashed', 'missing element is outlined');
    var badge = document.querySelector('.things18n-debug');
    ok(badge && /en · 1 missing/.test(badge.textContent) && /blocks/.test(badge.textContent), 'badge: ' + (badge && badge.textContent));
    var r = i.report();
    ok(r.missing.length === 1 && r.missing[0].key === 'Sem tradução nenhuma' && r.lopsidedBlocks === false && r.blocks['pt-BR'] === 1, 'report() lists the miss and counts blocks');
    i.t('another missing one'); i.debug(true);
    ok(i.report().js.indexOf('another missing one') >= 0, 'report() also lists t() keys with no translation');
    i.debug(false); await sleep(30);
    ok(!document.querySelector('[data-i18n-missing]') && !document.querySelector('.things18n-debug'), 'debug(false) cleans up');

    // ?i18n=debug in the URL
    var fr = document.createElement('iframe'); fr.src = location.pathname + '?i18n=debug&lang=en'; document.body.appendChild(fr);
    await new Promise(function (r) { fr.onload = r; }); await sleep(150);
    ok(!!fr.contentDocument.querySelector('.things18n-debug'), '?i18n=debug turns debug on from the URL');
    fr.remove();
  } catch (e) { out.push('FAIL exception: ' + e.stack); failed++; }
  finish();
})();
</script>
</body>
</html>
