<!doctype html>
<meta charset="utf-8">
<title>MeAsocie i18n e2e</title>
<!-- Run: python3 -m http.server 8765  then
     chrome --headless --virtual-time-budget=15000 --dump-dom http://localhost:8765/tools/e2e/game.html
     and look for "ALL PASSED" in #out. Same-origin iframe drives the real game. -->
<pre id="out">running…</pre>
<script>
var out = [], failed = 0;
function ok(cond, msg) { out.push((cond ? 'PASS ' : 'FAIL ') + msg); if (!cond) failed++; }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function load(url) {
  return new Promise(function (resolve) {
    var f = document.createElement('iframe');
    f.style.cssText = 'width:420px;height:800px';
    f.onload = function () { setTimeout(function () { resolve(f); }, 400); };
    f.src = url;
    document.body.appendChild(f);
  });
}
function cardTexts(w) { return [].map.call(w.document.querySelectorAll('.card:not(.down)'), function (c) { return c.textContent.trim(); }); }
function saved(w, k) { try { return JSON.parse(w.localStorage.getItem(k)); } catch (e) { return null; } }
function catNames(g) { return g.cats.map(function (c) { return c.nome; }).join('|'); }

(async function () {
  try {
    localStorage.clear();
    var G = '/things/me_associe/index.html';

    // 1. fresh start in English
    var f = await load(G + '?lang=en'), w = f.contentWindow, d = w.document;
    ok(d.documentElement.lang === 'en', 'html lang is en');
    ok(d.getElementById('undo').textContent === 'Undo' && d.getElementById('new').textContent === 'New game', 'buttons are English');
    ok(d.title === 'MeAsocie', 'title ok');
    ok(w.getComputedStyle(d.getElementById('mode')).display === 'none', 'medical switch hidden in English');
    var bankEn = w.WORD_BANK_EN, enWords = {};
    bankEn.forEach(function (c) { enWords[c.nome] = 1; c.palavras.forEach(function (p) { enWords[p] = 1; }); });
    var texts = cardTexts(w);
    ok(texts.length > 0 && texts.every(function (t) { return enWords[t]; }), 'every visible card is from the English bank (' + texts.length + ' cards)');
    var gEn = saved(w, 'associe:en:v1');
    ok(gEn && gEn.v === 2 && gEn.cats.length === 7, 'English game saved under associe:en:v1');
    ok(saved(w, 'associe:v2') === null, 'English play did not touch the Portuguese save key');
    ok(/Draw a card|Empty stock/.test(d.querySelector('.stock').getAttribute('aria-label')), 'stock aria-label is English: ' + d.querySelector('.stock').getAttribute('aria-label'));
    ok(/^Category /.test((d.querySelector('.slot[aria-label]') || {getAttribute: function () { return ''; }}).getAttribute('aria-label')) || /Free foundation/.test(d.querySelector('.slot').getAttribute('aria-label')), 'foundation aria is English');

    // 2. switch to Portuguese from the UI button
    d.querySelector('[data-i18n-set="pt-BR"]').click();
    await sleep(300);
    ok(d.documentElement.lang === 'pt-BR', 'html lang follows switch');
    ok(d.getElementById('undo').textContent === 'Desfazer' && d.getElementById('new').textContent === 'Novo jogo', 'buttons are Portuguese after switch');
    ok(w.getComputedStyle(d.getElementById('mode')).display !== 'none', 'medical switch visible in Portuguese');
    var ptWords = {};
    w.WORD_BANK.forEach(function (c) { ptWords[c.nome] = 1; c.palavras.forEach(function (p) { ptWords[p] = 1; }); });
    texts = cardTexts(w);
    ok(texts.length > 0 && texts.every(function (t) { return ptWords[t]; }), 'every visible card is Portuguese after switch');
    var gPt = saved(w, 'associe:v2');
    ok(gPt && gPt.cats.length === 7, 'Portuguese game saved under the ORIGINAL key associe:v2');
    ok(JSON.stringify(Object.keys(gPt).sort()) === JSON.stringify(['area','cats','cols','down','fc','finishedAt','history','leftAt','pool','ptr','slots','startedAt','top','v']), 'save shape unchanged (same fields as before)');
    ok(saved(w, 'associe:en:v1') && catNames(saved(w, 'associe:en:v1')) === catNames(gEn), 'English save was kept intact');

    // 3. back to English: the same English game resumes
    w.things18n.setLang('en');
    await sleep(300);
    ok(catNames(saved(w, 'associe:en:v1')) === catNames(gEn), 'English game resumed with the same categories');
    texts = cardTexts(w);
    ok(texts.every(function (t) { return enWords[t]; }), 'cards English again');

    // 4. reload in Portuguese: the saved pt game is restored as-is (existing players' saves)
    var before = catNames(saved(w, 'associe:v2'));
    f.remove();
    var f2 = await load(G + '?lang=pt-BR'), w2 = f2.contentWindow;
    ok(catNames(saved(w2, 'associe:v2')) === before, 'reload in pt-BR restored the existing Portuguese game');
    ok(w2.document.documentElement.lang === 'pt-BR', 'pt-BR page lang');

    // 5. medical mode survives a round trip through English
    w2.document.getElementById('mode').click();
    await sleep(300);
    ok(w2.document.documentElement.classList.contains('med'), 'medical mode on in pt');
    w2.things18n.setLang('en'); await sleep(300);
    ok(!w2.document.documentElement.classList.contains('med'), 'English is never medical');
    w2.things18n.setLang('pt-BR'); await sleep(300);
    ok(w2.document.documentElement.classList.contains('med'), 'medical mode restored on return to Portuguese');

    // 6. the status line re-translates (message stored as key + params)
    var st = w2.document.getElementById('status');
    ok(w2.things18n.t('msg.stuck', null, 'en') !== 'msg.stuck' && w2.things18n.t('msg.stuck', null, 'pt-BR') !== 'msg.stuck', 'status keys resolve in both languages');
    f2.remove();

    // 7. no raw keys anywhere on screen, both languages
    for (var L of ['en', 'pt-BR']) {
      var f3 = await load(G + '?lang=' + L), t3 = f3.contentWindow.document.body.innerText;
      ok(!/\b(actions|timer|win|msg|aria|board|mode|meta)\.[a-zA-Z]+\b/.test(t3), 'no raw i18n keys visible in ' + L);
      f3.remove();
    }
  } catch (e) { out.push('FAIL exception: ' + e.message); failed++; }
  document.getElementById('out').textContent = out.join('\n') + '\n' + (failed ? failed + ' FAILED' : 'ALL PASSED');
})();
</script>
