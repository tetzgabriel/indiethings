<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown — indiethings</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⏳%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../css/notebook.css">
  <style>
    #clock { font-size: 6rem; line-height: calc(var(--lh) * 3); text-align: center; font-family: var(--type); letter-spacing: .05em; }
    #clock.done { color: var(--red); animation: shake .4s infinite; }
    @keyframes shake { 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
    .presets { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin-bottom: var(--lh); }
    .row { display: flex; gap: 1rem; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: var(--lh); }
    input[type=number] { width: 4rem; text-align: center; }
    @media (max-width: 600px) { #clock { font-size: 3.6rem; } }
    @media (prefers-reduced-motion: reduce) { #clock.done { animation: none; } }
  </style>
</head>
<body>
<div class="thing-wrap">
  <a class="back" href="../../#things-page">← back to the notebook</a>
  <section class="page">
    <h2>countdown</h2>
    <p class="small">the tab title ticks too, so you can wander off to another tab. we'll beep when it's done.</p>

    <div id="clock" aria-live="off">05:00</div>

    <div class="presets" id="presets">
      <button class="btn" data-m="1">1 min</button>
      <button class="btn" data-m="5">5 min</button>
      <button class="btn" data-m="10">10 min</button>
      <button class="btn" data-m="25">25 (pomodoro)</button>
    </div>

    <div class="row">
      <label>custom: <input type="number" id="cm" min="0" max="999" value="5"> min
                      <input type="number" id="cs" min="0" max="59" value="0"> sec</label>
    </div>

    <p class="center">
      <button class="btn" id="go">start</button>
      <button class="btn" id="reset">reset</button>
    </p>
  </section>
</div>

<script>
(function () {
  var clock = document.getElementById("clock"), go = document.getElementById("go");
  var total = 300, endAt = 0, left = 300, timer = null;

  function fmt(s) {
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
  }
  function show() {
    clock.textContent = fmt(left);
    document.title = (timer ? "⏳ " + fmt(left) + " — " : "") + "Countdown — indiethings";
  }
  function set(sec) {
    stop(); total = left = Math.max(0, sec | 0);
    clock.classList.remove("done"); go.textContent = "start"; show();
  }
  function stop() { clearInterval(timer); timer = null; }

  function beep() {
    try {
      var a = new (window.AudioContext || window.webkitAudioContext)();
      [0, .25, .5].forEach(function (t) {
        var o = a.createOscillator(), g = a.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(a.destination);
        g.gain.setValueAtTime(.2, a.currentTime + t);
        g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + .2);
        o.start(a.currentTime + t); o.stop(a.currentTime + t + .2);
      });
    } catch (e) {}
  }

  function tick() {
    left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    if (left <= 0) {
      stop(); clock.classList.add("done"); go.textContent = "again";
      document.title = "⏰ done! — Countdown"; clock.textContent = fmt(0); beep(); return;
    }
    show();
  }

  go.addEventListener("click", function () {
    if (timer) { stop(); go.textContent = "resume"; show(); return; }  // pause
    if (left <= 0) set(total);                                          // again
    clock.classList.remove("done");
    endAt = Date.now() + left * 1000;
    timer = setInterval(tick, 250); go.textContent = "pause"; show();
  });
  document.getElementById("reset").addEventListener("click", function () { set(total); });
  document.getElementById("presets").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    document.getElementById("cm").value = b.dataset.m; document.getElementById("cs").value = 0;
    set(b.dataset.m * 60);
  });
  function custom() {
    set((+document.getElementById("cm").value || 0) * 60 + (+document.getElementById("cs").value || 0));
  }
  document.getElementById("cm").addEventListener("change", custom);
  document.getElementById("cs").addEventListener("change", custom);
  show();
})();
</script>
</body>
</html>
